name: KOLPulse Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: kolpulse-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # GitHub runners are temporary.
      # This restores kolpulse.db before the bot starts and
      # automatically saves it after the job finishes.
      - name: Restore persistent KOLPulse database
        uses: actions/cache@v4
        with:
          path: kolpulse.db
          key: kolpulse-db-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: | kolpulse-db-${{ github.ref_name }}- 
      - name: Show database status
        run: | if [ -f kolpulse.db ]; then echo "KOLPulse database restored successfully." ls -lh kolpulse.db else echo "No previous database found. A new kolpulse.db will be created." fi 
      - name: Run KOLPulse Bot
        env:
          BOT_TOKEN: "${{ secrets.BOT_TOKEN }}"
          GROUP_CHAT_ID: "${{ secrets.GROUP_CHAT_ID }}"
          OWNER_USER_ID: "${{ secrets.OWNER_USER_ID }}"
          PROMOTIONAL_VIDEO_FILE_ID: "${{ secrets.PROMOTIONAL_VIDEO_FILE_ID }}"
          PREMIUM_EMOJI_CALL: "${{ secrets.PREMIUM_EMOJI_CALL }}"
          PREMIUM_EMOJI_PLANE: "${{ secrets.PREMIUM_EMOJI_PLANE }}"
          PREMIUM_EMOJI_CONTRACT: "${{ secrets.PREMIUM_EMOJI_CONTRACT }}"
          PREMIUM_EMOJI_KOL: "${{ secrets.PREMIUM_EMOJI_KOL }}"
          PREMIUM_EMOJI_BOT: "${{ secrets.PREMIUM_EMOJI_BOT }}"
          PYTHONUNBUFFERED: "1"
        run: timeout --signal=TERM --kill-after=30s 19800s python -u bot.py

      - name: Confirm database
        if: always()
        run: | if [ -f kolpulse.db ]; then echo "KOLPulse database will be persisted by GitHub Actions cache." ls -lh kolpulse.db else echo "WARNING: kolpulse.db was not found." fi 
      - name: Start next run automatically
        if: always()
        env:
          GH_TOKEN: "${{ github.token }}"
        run: gh workflow run bot.yml --ref main

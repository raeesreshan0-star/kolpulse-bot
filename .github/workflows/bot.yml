name: KOLPulse Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "kolpulse.db"
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: kolpulse-bot
  cancel-in-progress: false

# IMPORTANT:
# The database is committed back to the repository after every run.
# This makes KOLPulse data persistent across GitHub Actions runners,
# not dependent only on temporary workflow artifacts.
permissions:
  contents: write
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The committed repository database is the PRIMARY source of truth.
      # Never overwrite a newer kolpulse.db with an older artifact.
      - name: Restore KOLPulse database (artifact fallback only)
        if: ${{ !hashFiles('kolpulse.db') }}
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v22
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: bot.yml
          branch: main
          workflow_conclusion: success
          name: kolpulse-db
          path: .
          search_artifacts: true
          check_artifacts: true
          if_no_artifact_found: warn

             - name: Check database
        shell: bash
        run: |
          if [ -f kolpulse.db ]; then
            echo "Database found"
            ls -lh kolpulse.db
          else
            echo "Database not found"
          fi

      - name: Verify database integrity
        shell: bash
        run: |
          if [ -f kolpulse.db ]; then
            python -c "import sqlite3; c=sqlite3.connect('kolpulse.db'); c.execute('PRAGMA integrity_check').fetchone(); c.close(); print('Database integrity check completed')"
          else
            echo "No database file to verify"
          fi
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run KOLPulse Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
          OWNER_USER_ID: ${{ secrets.OWNER_USER_ID }}
          PROMOTIONAL_VIDEO_FILE_ID: ${{ secrets.PROMOTIONAL_VIDEO_FILE_ID }}
          PREMIUM_EMOJI_CALL: ${{ secrets.PREMIUM_EMOJI_CALL }}
          PREMIUM_EMOJI_PLANE: ${{ secrets.PREMIUM_EMOJI_PLANE }}
          PREMIUM_EMOJI_CONTRACT: ${{ secrets.PREMIUM_EMOJI_CONTRACT }}
          PREMIUM_EMOJI_KOL: ${{ secrets.PREMIUM_EMOJI_KOL }}
          PREMIUM_EMOJI_BOT: ${{ secrets.PREMIUM_EMOJI_BOT }}
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: | timeout --signal=SIGTERM --kill-after=30s 19200s python -u bot.py status=$? if [ "$status" -eq 124 ]; then echo "Bot reached the planned 5h20m runtime; exiting normally." exit 0 fi exit "$status" 
      # Keep the artifact as a short-term recovery copy.
      # The repository copy below is the permanent source of truth.
      - name: Backup KOLPulse database artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kolpulse-db
          path: kolpulse.db
          if-no-files-found: warn
          retention-days: 90

      - name: Persist KOLPulse database to repository
        if: always() && hashFiles('kolpulse.db') != ''
        shell: bash
        run: | set -e 
          git config user.name "KOLPulse Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage the current database even if it is ignored by .gitignore.
          git add -f kolpulse.db

          if git diff --cached --quiet -- kolpulse.db; then
            echo "ℹ️ No database changes to commit."
            exit 0
          fi

          git commit -m "chore: persist KOLPulse database"

          # The database commit is the permanent source of truth.
          # Do not replace it with an older artifact on the next run.
          git fetch origin main
          git merge origin/main --no-edit -X ours

          git push origin HEAD:main
          echo "✅ KOLPulse database permanently persisted to main." 

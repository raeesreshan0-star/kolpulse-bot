 name: KOLPulse Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # GitHub Actions cannot schedule a recurring 5h30m interval directly.
    # A 6-hour schedule is used so one 5h30m bot run finishes before
    # the next runner starts, avoiding overlapping bots and data corruption.

    - cron: "0 0,6,12,18 * * *"

concurrency:
  group: kolpulse-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    # 5h30m bot + 15m safety margin.
    timeout-minutes: 345

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore latest KOLPulse database
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v22
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: bot.yml
          branch: main
          workflow_conclusion: success
          name: kolpulse-db
          path: .
          search_artifacts: true
          check_artifacts: true
          if_no_artifact_found: warn

      - name: Verify database
        shell: bash
        run: |
          if [ -f kolpulse.db ]; then
            echo "========================================"
            echo "KOLPulse database restored."
            echo "Existing data will be preserved."
            ls -lh kolpulse.db
            echo "========================================"
          else
            echo "No previous database artifact found."
            echo "The bot will create kolpulse.db."
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run KOLPulse Bot
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
          OWNER_USER_ID: ${{ secrets.OWNER_USER_ID }}
          PROMOTIONAL_VIDEO_FILE_ID: ${{ secrets.PROMOTIONAL_VIDEO_FILE_ID }}
          PREMIUM_EMOJI_CALL: ${{ secrets.PREMIUM_EMOJI_CALL }}
          PREMIUM_EMOJI_PLANE: ${{ secrets.PREMIUM_EMOJI_PLANE }}
          PREMIUM_EMOJI_CONTRACT: ${{ secrets.PREMIUM_EMOJI_CONTRACT }}
          PREMIUM_EMOJI_KOL: ${{ secrets.PREMIUM_EMOJI_KOL }}
          PREMIUM_EMOJI_BOT: ${{ secrets.PREMIUM_EMOJI_BOT }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e

          # One bot cycle = exactly 5h30m.
          MAX_SECONDS=$((5 * 60 * 60 + 30 * 60))
          END_TIME=$((SECONDS + MAX_SECONDS))

          echo "KOLPulse bot cycle started."
          echo "Maximum cycle: 5 hours 30 minutes."

          while [ "$SECONDS" -lt "$END_TIME" ]; do
            REMAINING=$((END_TIME - SECONDS))

            echo "Starting bot process."
            echo "Remaining cycle time: ${REMAINING}s"

            timeout --foreground               --signal=TERM               --kill-after=30s               "${REMAINING}s"               python -u bot.py

            EXIT_CODE=$?

            if [ "$SECONDS" -ge "$END_TIME" ]; then
              echo "5h30m reached. Ending this cycle normally."
              break
            fi

            echo "Bot exited unexpectedly. Exit code: ${EXIT_CODE}"
            echo "Restarting bot in 5 seconds..."
            sleep 5
          done

          echo "Bot cycle finished."

      - name: Check database before backup
        if: always()
        shell: bash
        run: |
          if [ -f kolpulse.db ]; then
            echo "Final database found:"
            ls -lh kolpulse.db
          else
            echo "WARNING: kolpulse.db was not found."
          fi

      - name: Save KOLPulse database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kolpulse-db
          path: kolpulse.db
          if-no-files-found: warn
          retention-days: 90

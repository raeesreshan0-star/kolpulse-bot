name: KOLPulse Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: | python -m pip install --upgrade pip pip install -r requirements.txt 
      - name: Restore KOLPulse database
        uses: actions/cache@v4
        with:
          path: kolpulse.db
          key: kolpulse-db-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: | kolpulse-db-${{ github.ref_name }}- 
      - name: Check database
        run: | if [ -f kolpulse.db ]; then echo "KOLPulse database restored." ls -lh kolpulse.db else echo "No existing database found. A new database will be created." fi 
      - name: Run KOLPulse Bot
        env:
          BOT_TOKEN: "${{ secrets.BOT_TOKEN }}"
          GROUP_CHAT_ID: "${{ secrets.GROUP_CHAT_ID }}"
          OWNER_USER_ID: "${{ secrets.OWNER_USER_ID }}"
          PROMOTIONAL_VIDEO_FILE_ID: "${{ secrets.PROMOTIONAL_VIDEO_FILE_ID }}"
          PREMIUM_EMOJI_CALL: "${{ secrets.PREMIUM_EMOJI_CALL }}"
          PREMIUM_EMOJI_PLANE: "${{ secrets.PREMIUM_EMOJI_PLANE }}"
          PREMIUM_EMOJI_CONTRACT: "${{ secrets.PREMIUM_EMOJI_CONTRACT }}"
          PREMIUM_EMOJI_KOL: "${{ secrets.PREMIUM_EMOJI_KOL }}"
          PREMIUM_EMOJI_BOT: "${{ secrets.PREMIUM_EMOJI_BOT }}"
          PYTHONUNBUFFERED: "1"
        run: | timeout --signal=TERM --kill-after=10s 5h50m python bot.py         continue-on-error: true

      - name: Confirm database
        if: always()
        run: | if [ -f kolpulse.db ]; then echo "Database exists after bot run." ls -lh kolpulse.db else echo "Database file not found." fi 
      - name: Save KOLPulse database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: kolpulse.db
          key: kolpulse-db-${{ github.ref_name }}-${{ github.run_id }}

      - name: Start next run automatically
        if: always()
        env:
          GH_TOKEN: "${{ github.token }}"
        run: | gh workflow run bot.yml --ref main  

name: KOLPulse Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Only one KOLPulse bot may run at a time.
# When new code is pushed, the old bot run is cancelled automatically.
concurrency:
  group: kolpulse-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Restore the newest available KOLPulse database for this branch.
      # The run_id makes each saved cache unique so a newer database can be saved.
      - name: Restore KOLPulse database
        uses: actions/cache@v4
        with:
          path: kolpulse.db
          key: "kolpulse-db-${{ github.ref_name }}-${{ github.run_id }}"
          restore-keys: "kolpulse-db-${{ github.ref_name }}-"

      - name: Check database
        run: 'if [ -f kolpulse.db ]; then echo "Database restored"; ls -lh kolpulse.db; else echo "No database found - new database will be created"; fi'

      - name: Run KOLPulse Bot
        env:
          BOT_TOKEN: "${{ secrets.BOT_TOKEN }}"
          GROUP_CHAT_ID: "${{ secrets.GROUP_CHAT_ID }}"
          OWNER_USER_ID: "${{ secrets.OWNER_USER_ID }}"
          PROMOTIONAL_VIDEO_FILE_ID: "${{ secrets.PROMOTIONAL_VIDEO_FILE_ID }}"
          PREMIUM_EMOJI_CALL: "${{ secrets.PREMIUM_EMOJI_CALL }}"
          PREMIUM_EMOJI_PLANE: "${{ secrets.PREMIUM_EMOJI_PLANE }}"
          PREMIUM_EMOJI_CONTRACT: "${{ secrets.PREMIUM_EMOJI_CONTRACT }}"
          PREMIUM_EMOJI_KOL: "${{ secrets.PREMIUM_EMOJI_KOL }}"
          PREMIUM_EMOJI_BOT: "${{ secrets.PREMIUM_EMOJI_BOT }}"
          PYTHONUNBUFFERED: "1"
        run: | timeout --signal=TERM --kill-after=30s 19800s python -u bot.py status=$? if [ "$status" -eq 124 ]; then echo "Bot reached the 5.5 hour runtime limit; starting a fresh run." exit 0 fi exit "$status" 
      - name: Confirm database
        if: always()
        run: 'if [ -f kolpulse.db ]; then echo "Database file exists"; ls -lh kolpulse.db; else echo "WARNING: kolpulse.db was not found"; fi'

      # Continue automatically only when the bot ended normally or reached
      # the runtime limit. A cancelled old run must not create another run.
      - name: Start next run automatically
        if: ${{ success() }}
        env:
          GH_TOKEN: "${{ github.token }}"
        run: gh workflow run bot.yml --ref main

name: KOLPulse Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: kolpulse-bot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 290

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: | python -m pip install --upgrade pip python -m pip install -r requirements.txt 
      - name: Restore KOLPulse database
        uses: actions/cache/restore@v4
        with:
          path: kolpulse.db
          key: kolpulse-db-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: | kolpulse-db-${{ github.ref_name }}- 
      - name: Check database
        run: | if [ -f kolpulse.db ]; then echo "Database restored: kolpulse.db" ls -lh kolpulse.db else echo "No previous database found. Bot will create a new database." fi 
      - name: Run KOLPulse Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
          OWNER_USER_ID: ${{ secrets.OWNER_USER_ID }}
          PROMOTIONAL_VIDEO_FILE_ID: ${{ secrets.PROMOTIONAL_VIDEO_FILE_ID }}
          PREMIUM_EMOJI_CALL: ${{ secrets.PREMIUM_EMOJI_CALL }}
          PREMIUM_EMOJI_PLANE: ${{ secrets.PREMIUM_EMOJI_PLANE }}
          PREMIUM_EMOJI_CONTRACT: ${{ secrets.PREMIUM_EMOJI_CONTRACT }}
          PREMIUM_EMOJI_KOL: ${{ secrets.PREMIUM_EMOJI_KOL }}
          PREMIUM_EMOJI_BOT: ${{ secrets.PREMIUM_EMOJI_BOT }}
          PYTHONUNBUFFERED: "1"
        run: | python -u bot.py 
      - name: Save KOLPulse database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: kolpulse.db
          key: kolpulse-db-${{ github.ref_name }}-${{ github.run_id }}

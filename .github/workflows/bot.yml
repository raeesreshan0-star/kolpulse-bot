name: KOLPulse Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: kolpulse-bot
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: | python -m pip install --upgrade pip python -m pip install -r requirements.txt 
      - name: Run KOLPulse Bot
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
          OWNER_USER_ID: ${{ secrets.OWNER_USER_ID }}
          PROMOTIONAL_VIDEO_FILE_ID: ${{ secrets.PROMOTIONAL_VIDEO_FILE_ID }}
          PREMIUM_EMOJI_CALL: ${{ secrets.PREMIUM_EMOJI_CALL }}
          PREMIUM_EMOJI_PLANE: ${{ secrets.PREMIUM_EMOJI_PLANE }}
          PREMIUM_EMOJI_CONTRACT: ${{ secrets.PREMIUM_EMOJI_CONTRACT }}
          PREMIUM_EMOJI_KOL: ${{ secrets.PREMIUM_EMOJI_KOL }}
          PREMIUM_EMOJI_BOT: ${{ secrets.PREMIUM_EMOJI_BOT }}
          PYTHONUNBUFFERED: "1"
        run: | echo "KOLPulse Bot started." timeout --kill-after=30s 5h30m python -u bot.py exit_code=$? echo "Bot process ended with exit code: $exit_code" exit 0 
      - name: Start the next run automatically
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: | echo "Waiting before starting the next KOLPulse run..." sleep 15 gh workflow run bot.yml --ref main echo "Next KOLPulse run requested."  

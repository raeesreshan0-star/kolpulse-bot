name: KOLPulse Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: kolpulse-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore KOLPulse database
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v22
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: bot.yml
          branch: main
          workflow_conclusion: success
          name: kolpulse-db
          path: .
          search_artifacts: true
          check_artifacts: true
          if_no_artifact_found: warn

      - name: Verify database
        shell: bash
        run: |
          if [ -f kolpulse.db ]; then
            echo "KOLPulse database restored successfully."
            ls -lh kolpulse.db
          else
            echo "No previous KOLPulse database found. Creating a new one."
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run KOLPulse Bot
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
          OWNER_USER_ID: ${{ secrets.OWNER_USER_ID }}
          PROMOTIONAL_VIDEO_FILE_ID: ${{ secrets.PROMOTIONAL_VIDEO_FILE_ID }}
          PREMIUM_EMOJI_CALL: ${{ secrets.PREMIUM_EMOJI_CALL }}
          PREMIUM_EMOJI_PLANE: ${{ secrets.PREMIUM_EMOJI_PLANE }}
          PREMIUM_EMOJI_CONTRACT: ${{ secrets.PREMIUM_EMOJI_CONTRACT }}
          PREMIUM_EMOJI_KOL: ${{ secrets.PREMIUM_EMOJI_KOL }}
          PREMIUM_EMOJI_BOT: ${{ secrets.PREMIUM_EMOJI_BOT }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e

          MAX_SECONDS=$((5 * 60 * 60 + 30 * 60))
          END_TIME=$((SECONDS + MAX_SECONDS))

          echo "KOLPulse cycle started: 5h30m."

          while [ "$SECONDS" -lt "$END_TIME" ]; do
            REMAINING=$((END_TIME - SECONDS))

            echo "Starting KOLPulse bot."
            echo "Remaining cycle: ${REMAINING}s"

            timeout --foreground               --signal=TERM               --kill-after=30s               "${REMAINING}s"               python -u bot.py

            EXIT_CODE=$?

            if [ "$SECONDS" -ge "$END_TIME" ]; then
              echo "5h30m completed. Ending this cycle."
              break
            fi

            echo "Bot stopped unexpectedly. Exit code: ${EXIT_CODE}"
            echo "Restarting bot in 5 seconds..."
            sleep 5
          done

          echo "KOLPulse cycle finished."

      - name: Check database before backup
        if: always()
        shell: bash
        run: |
          if [ -f kolpulse.db ]; then
            echo "Database ready for backup:"
            ls -lh kolpulse.db
          else
            echo "WARNING: kolpulse.db not found."
          fi

      - name: Save KOLPulse database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kolpulse-db
          path: kolpulse.db
          if-no-files-found: warn
          retention-days: 90
